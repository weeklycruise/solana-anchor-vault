[package]
name = "solana-anchor-vault"
version = "0.1.0"
description = "High-performance Solana Anchor multi-token vault and escrow"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solana_anchor_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.0"
anchor-spl = "0.30.0"
